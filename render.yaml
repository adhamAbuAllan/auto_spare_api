services:
  - type: web
    name: auto-spare-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    autoDeploy: true
    disk:
      name: media
      mountPath: /var/data/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: TIME_ZONE
        value: UTC
      - key: ENABLE_NGROK
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: CAR_IMAGES_API_BASE_URL
        value: https://carimagesapi.com/api/v1
      - key: CAR_IMAGES_API_FALLBACK_BASE_URLS
        sync: false
      - key: CAR_IMAGES_API_PROXY_TOKEN
        sync: false
      - key: CAR_IMAGES_API_KEY
        sync: false
      - key: CAR_IMAGES_API_SECRET
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: auto-spare-db
          property: connectionString
      - key: CHANNEL_LAYER_BACKEND
        value: redis
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: CHAT_ALLOWED_MEDIA_TYPES
        value: text/plain,image/jpeg,image/png,image/webp,image/gif,application/pdf,video/mp4,audio/mpeg,audio/mp4,audio/aac,audio/x-m4a,audio/mp4a-latm,audio/ogg,audio/wav,audio/x-wav,audio/webm
      - key: REDIS_URL
        fromService:
          type: redis
          name: auto-spare-redis
          property: connectionString

  - type: redis
    name: auto-spare-redis
    plan: free
    ipAllowList: []

databases:
  - name: auto-spare-db
    plan: free
